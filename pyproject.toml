[project]
name = "video-lab"
version = "1.0.0"
description = "Extendable local Streamlit video analysis app with FPS conversion and optical flow"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.42,<2",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "imageio-ffmpeg>=0.6,<1",
    "streamlit-image-coordinates>=0.4.1,<1",
    "pillow>=10,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
